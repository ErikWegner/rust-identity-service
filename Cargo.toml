[package]
name = "ridser"
version = "3.0.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie"] }
axum-macros = "0.5"
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false }
cookie = { version = "0.18.1", features = ["private"] }
dotenvy = "0.15.7"
http-body-util = "0.1.4"
hyper = { version = "1.10", features = ["full"] }
hyper-util = { version = "0.1.20", features = ["client-legacy"] }
hyper-rustls = "0.27"
oauth2 = "5.0.0"
openidconnect = "4.0.1"
rand = "0.10.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
time = "0.3.53"
tokio = { version = "1.53.0", features = [
    "fs",
    "macros",
    "rt-multi-thread",
    "signal",
] }
tower-http = { version = "0.7.0", features = ["fs", "trace"] }
tower-sessions = { version = "0.15.0", features = ["private"] }
tower-sessions-redis-store = "0.16.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower = { version = "0.5.3", features = ["util"] }
mimalloc = "0.1.52"
rustls = { version = "0.23.42", features = ["ring"] }

[dev-dependencies]
hyper = "1.10.1"
once_cell = "1.21.4"
tracing-log = "0.2.0"
wiremock = "0.6.5"

[patch.crates-io]
tower-sessions-redis-store = { git = "https://github.com/maxcountryman/tower-sessions-stores.git" }
